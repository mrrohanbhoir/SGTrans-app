name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "SGTrans-project (1).zip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APKs
        working-directory: lorry-ledger-apps
        run: |
          set -e
          flutter create --platforms=android .
          python3 scripts/patch_android.py
          flutter pub get
          echo "=== FIND OWNER FILE ==="
          grep -rn -C 15 "not set up as an owner" lib/ || true
          
