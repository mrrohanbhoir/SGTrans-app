name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "SGTrans-project (1).zip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APKs
        working-directory: lorry-ledger-apps
        run: |
          set -e
          mkdir -p ~/.gradle
          echo 'allprojects { tasks.configureEach { if (name.toLowerCase().contains("lint")) enabled = false } }' > ~/.gradle/init.gradle
          flutter create --platforms=android .
          python3 scripts/patch_android.py
          flutter pub get

          python3 - << 'PY'
          from pathlib import Path
          p = Path("lib/owner/owner_home.dart")
          txt = p.read_text(encoding="utf-8")
          txt = txt.replace(
              "if (snap.hasError || !(snap.data?.exists ?? false)) {",
              "if (false) {"
          )
          txt = txt.replace(
              "return const _OwnerShell();",
              "return const _OwnerShell();"
          )
          # Jar builder madhe direct _OwnerShell return karayche asel tar:
          txt = txt.replace(
              "builder: (context, snap) {",
              "builder: (context, snap) {\n                    return const _OwnerShell();"
          )
          p.write_text(txt, encoding="utf-8")
          print("Patched lib/owner/owner_home.dart successfully")
          PY

          PKG=$(grep -oP 'applicationId\s*=?\s*"\K[^"]+' android/app/build.gradle* | head -n 1 || true)
          if [ -z "$PKG" ]; then
            PKG="com.example.sgtrans"
          fi
          echo "Detected Package Name: $PKG"

          mkdir -p android/app
          cat <<EOF > android/app/google-services.json
          {
            "project_info": {
              "project_number": "479129213410",
              "firebase_url": "https://sgtrans-46ebb.firebaseio.com",
              "project_id": "sgtrans-46ebb",
              "storage_bucket": "sgtrans-46ebb.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:479129213410:android:8fd7eae238491ef26b94a5",
                  "android_client_info": {
                    "package_name": "$PKG"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "479129213410-lk1offbr56gaa1sl61o8labqlnr6doja.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDoddnOtBlLkA-e_PHJSy8t_mlmTwlOhQM"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "479129213410-lk1offbr56gaa1sl61o8labqlnr6doja.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          cat <<EOF > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyDoddnOtBlLkA-e_PHJSy8t_mlmTwlOhQM',
              appId: '1:479129213410:android:8fd7eae238491ef26b94a5',
              messagingSenderId: '479129213410',
              projectId: 'sgtrans-46ebb',
              storageBucket: 'sgtrans-46ebb.firebasestorage.app',
            );

            static const FirebaseOptions currentPlatform = android;
          }
          EOF

          flutter build apk --release -t lib/main_owner.dart
          cp build/app/outputs/flutter-apk/app-release.apk Owner-App.apk

          flutter build apk --release -t lib/main_driver.dart
          cp build/app/outputs/flutter-apk/app-release.apk Driver-App.apk

          flutter build apk --release -t lib/main_customer.dart
          cp build/app/outputs/flutter-apk/app-release.apk Customer-App.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SGTrans-APKs
          path: lorry-ledger-apps/*.apk
