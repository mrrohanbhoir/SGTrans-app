name: Build APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -o "SGTrans-project (1).zip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APKs
        working-directory: lorry-ledger-apps
        run: |
          mkdir -p ~/.gradle
          echo 'allprojects { tasks.configureEach { if (name.toLowerCase().contains("lint")) enabled = false } }' > ~/.gradle/init.gradle
          flutter create --platforms=android .
          python3 scripts/patch_android.py
          flutter pub get

          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;

          class DefaultFirebaseOptions {
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyB82gI2gCK6MVnzd257Vvwv60hxOePcuzso',
              appId: '1:26673262400:web:81925a2be71483d16b94a5',
              messagingSenderId: '26673262400',
              projectId: 'rohan-45eef',
              storageBucket: 'rohan-45eef.firebasestorage.app',
            );

            static const FirebaseOptions currentPlatform = android;
          }
          EOF

          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "26673262400",
              "project_id": "rohan-45eef",
              "storage_bucket": "rohan-45eef.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:26673262400:web:81925a2be71483d16b94a5",
                  "android_client_info": {
                    "package_name": "com.example.lorry_ledger"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyB82gI2gCK6MVnzd257Vvwv60hxOePcuzso"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          flutter build apk --release -t lib/main_owner.dart
          cp build/app/outputs/flutter-apk/app-release.apk Owner-App.apk
          flutter build apk --release -t lib/main_driver.dart
          cp build/app/outputs/flutter-apk/app-release.apk Driver-App.apk
          flutter build apk --release -t lib/main_customer.dart
          cp build/app/outputs/flutter-apk/app-release.apk Customer-App.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SGTrans-APKs
          path: lorry-ledger-apps/*.apk
